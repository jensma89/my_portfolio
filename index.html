<!DOCTYPE html>
<html>
<head>

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jens Mayer – Backend &amp; IoT Developer Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jens Mayer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SEO & Social preview -->
  <meta name="author" content="Jens Mayer">
  <meta name="keywords" content="Backend Developer, IoT, Python, Go, FastAPI, Portfolio">

  <!-- Open Graph (LinkedIn, Discord, WhatsApp preview) -->
  <meta property="og:title" content="Jens Mayer – Backend & IoT Developer">
  <meta property="og:description" content="Backend developer specialized in Python & Go. Building APIs, IoT systems and accessible software.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jens-mayer.dev">

  <meta property="og:image" content="https://jens-mayer.dev/icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jens Mayer – Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Allow pinch-to-zoom on mobile: Flutter sets touch-action:none on its
       canvas via JS, but !important in a stylesheet beats normal inline styles. */
    flt-glass-pane {
      touch-action: pan-x pan-y pinch-zoom !important;
    }
  </style>

  <script>
    // Allow ctrl+scroll zoom on desktop (Mac trackpad pinch = ctrl+wheel).
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) e.stopImmediatePropagation();
    }, { capture: true, passive: true });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
